version: 2

sources:
  - name: raw
    database: finrag
    schema: raw
    tables:
      - name: raw_ohlcv
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: ticker
            tests: [not_null]
          - name: ts
            tests: [not_null]
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ["binance", "coingecko"]

      - name: raw_articles
        loaded_at_field: _ingested_at
        columns:
          - name: article_id
            tests: [not_null]

      - name: raw_tweets
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 72, period: hour }
          error_after: { count: 168, period: hour }
        columns:
          - name: tweet_id
            tests: [not_null]
